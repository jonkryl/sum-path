name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Google Play version code, larger than every previous upload
        required: true
        default: '1'
      version_name:
        description: Public app version
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/android-ci.yml

  signed-release:
    name: Sign, verify and publish downloadable APK/AAB
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: write
    env:
      YANDEX_BANNER_ID: ${{ vars.YANDEX_BANNER_ID }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Set up Android SDK and API 36 build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Set the ephemeral upload key path
        run: printf 'KEYSTORE_FILE=%s/sum-path-upload.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Load the protected upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          test -n "$YANDEX_BANNER_ID"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
      - name: Build signed APK and Play bundle
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Validate signatures, manifest and 16 KB page alignment
        run: bash scripts/verify-release.sh
      - name: Save verified release and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            release-output/
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish the verified downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}-${VERSION_CODE}" release-output/* --target "$GITHUB_SHA" --title "Sum Path ${VERSION_NAME} (${VERSION_CODE})" --notes-file scripts/release-notes.md
      - name: Remove the ephemeral key
        if: always()
        run: rm -f "$KEYSTORE_FILE"
